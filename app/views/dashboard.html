<div id="dashboard-summary-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px;"></div>

<div class="dashboard-panels" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;">
  <div class="card">
    <h3 style="margin: 0 0 12px; font-size: 14px; font-weight: 500;">Trạng thái công việc</h3>
    <div style="position: relative; height: 240px;"><canvas id="dashboard-status-chart"></canvas></div>
  </div>
  <div class="card">
    <h3 style="margin: 0 0 12px; font-size: 14px; font-weight: 500;">Deadline sắp tới</h3>
    <div id="dashboard-deadline-list"></div>
  </div>
</div>
