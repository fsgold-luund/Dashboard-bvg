<div class="app-header">
  <div style="display: flex; align-items: center; gap: 12px;">
    <button class="btn" id="btn-sidebar-toggle" aria-label="Mở menu điều hướng">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <span style="font-weight: 500;">Hệ thống quản trị công việc</span>
  </div>
  <div style="display: flex; align-items: center; gap: 16px;">
    <button class="btn" id="btn-theme-toggle" aria-label="Đổi giao diện sáng/tối">
      <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
    </button>
    <span class="material-symbols-outlined" style="color: var(--text-secondary);" aria-hidden="true">notifications</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div id="user-avatar" style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;"></div>
      <span id="user-fullname" style="font-size: 13px;"></span>
    </div>
    <button class="btn" id="btn-logout">Đăng xuất</button>
  </div>
</div>
