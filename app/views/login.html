<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="width:380px;max-width:100%;border-radius:20px;">
    <h1 style="font-size:18px;font-weight:500;margin:0 0 4px;">Đăng nhập</h1>
    <p class="text-muted" style="margin:0 0 20px;font-size:13px;">Hệ thống quản trị công việc</p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" name="email" placeholder="ten@congty.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input class="form-input" type="password" name="password" required />
      </div>
      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" name="rememberMe" /> Ghi nhớ đăng nhập
        </label>
        <a href="#" id="link-forgot-password" style="font-size:13px;">Quên mật khẩu?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Đăng nhập</button>
    </form>
  </div>
</div>
