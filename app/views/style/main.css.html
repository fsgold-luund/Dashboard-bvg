<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); }
body { font-size: 14px; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

.app-shell { display: flex; min-height: 100vh; }
.app-sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); flex-shrink: 0; transition: width .2s ease; }
.app-sidebar.collapsed { width: 64px; }
.app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.app-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
.app-content { flex: 1; padding: 24px; overflow-y: auto; }
.app-footer { padding: 12px 24px; font-size: 12px; color: var(--text-secondary); text-align: center; border-top: 1px solid var(--border); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 16px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); padding: 8px 14px; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-fab { position: fixed; right: 24px; bottom: 24px; border-radius: 999px; padding: 14px 20px; box-shadow: var(--shadow-card); background: var(--accent); color: #fff; border: none; z-index: 30; }

.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-accent { background: var(--accent-bg); color: var(--accent); }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.form-input { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text-primary); }
.form-input:focus { outline: none; border-color: var(--accent); }

.hidden { display: none !important; }
.text-muted { color: var(--text-secondary); }

.skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--bg) 37%, var(--border) 63%); background-size: 400% 100%; animation: skeleton-loading 1.4s ease infinite; border-radius: var(--radius-sm); }
@keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

@keyframes modal-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
</style>
